[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-service-mesh-router"
version = "0.1.0"
description = "Offline model of OCI Service Mesh: config validation plus deterministic canary traffic replay"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
